<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ModaWear - Kids</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #fafafa; color: #333; }
  .container { max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; }

  header { background: white; border-bottom: 1px solid #ddd; padding: 1rem 0; position: sticky; top: 0; z-index: 10; }
  .header-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
  .logo { font-weight: 700; font-size: 1.5rem; color: #000; cursor: pointer; }
  nav a { margin-left: 2rem; color: #555; text-decoration: none; font-weight: 500; }
  nav a:hover, nav a.active { color: #111; border-bottom: 2px solid #111; }

  h2 { font-weight: 700; font-size: 2rem; margin: 2rem 0 1rem; color: #111; text-align: center; }

  .product-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 1.5rem; }
  .product-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 0 8px rgba(0,0,0,0.05); transition: box-shadow 0.3s ease; }
  .product-card:hover { box-shadow: 0 0 15px rgba(0,0,0,0.15); }
  .product-card img { width: 100%; height: 280px; object-fit: cover; }
  .product-info { padding: 1rem; text-align: center; }
  .product-info h3 { margin-bottom: 0.5rem; font-weight: 600; font-size: 1.1rem; color: #222; }
  .product-info p { margin-bottom: 1rem; font-weight: 700; color: #111; }
  .product-info button { background: #000; color: white; border: none; padding: 0.5rem 1.2rem; border-radius: 40px; font-weight: 600; cursor: pointer; transition: background 0.3s ease; }
  .product-info button:hover { background: #444; }

  footer { text-align: center; padding: 1.5rem 0; background: #f2f2f2; color: #777; font-size: 0.9rem; margin-top: 2rem; }
</style>
</head>
<body>

<header>
  <div class="header-container">
    <div class="logo">ModaWear</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="women.html">Women</a>
      <a href="men.html">Men</a>
      <a href="kids.html" class="active">Kids</a>
      <a href="#">Cart</a>
    </nav>
  </div>
</header>

      <div class="product-info">
        <h3> Denim Jacket</h3>
        <p>Rs. 1,399.00</p>
        <button onclick="backpage()">Back to Home</button>
      </div>
    </div>
    <div class="product-card">
      <img src="https://image.hm.com/assets/hm/d7/55/d7550b0997a90b5ac7248511047d0ed891401c20.jpg?imwidth=768" alt="Printed resort shirt" />
      <div class="product-info">
        <h3>Printed resort shirt</h3>
        <p>Rs. 799.00</p>
        <button onclick="backpage()">Back to Home</button>
      </div>
    </div>
    <div class="product-card">
      <img src="https://image.hm.com/assets/hm/24/20/2420bbd8c0ae2cfca89f9ca1aea2d5f043ab87f8.jpg?imwidth=768" alt="Appliquéd tulle skirt" />
      <div class="product-info">
        <h3>Appliquéd tulle skirt</h3>
        <p>Rs. 1,399.00</p>
       <button onclick="backpage()">Back to Home</button>
      </div>
    </div>
    <div class="product-card">
      <img src="https://image.hm.com/assets/hm/90/09/900929caa97a047a04eb3e3ccf520153028980c9.jpg?imwidth=768" alt="Pile pram suit with ears" />
      <div class="product-info">
        <h3>Pile pram suit with ears</h3>
        <p>Rs. 1,399.00</p>
        <button onclick="backpage()">Back to Home</button>
      </div>
    </div>
  </div>
</div>

<footer>
  &copy; 2025 ModaWear. All rights reserved.
</footer>

function backpage() {
  window.location.href = "/main";

</body>
</html>
